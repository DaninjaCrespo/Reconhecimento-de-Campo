<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scouting Definitivo - Paranapiacaba</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #050505; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #mapa-campo { height: 100vh; width: 100vw; z-index: 1; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* HEADER */
        .scout-header {
            position: absolute; top: 0; left: 0; width: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            color: #00ff66; padding: 15px; z-index: 1000; pointer-events: none;
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .gps-status { font-family: monospace; font-size: 11px; color: #fff; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; border: 1px solid #444; }

        /* BARRA INFERIOR DE AÇÕES (MOBILE) */
        .scout-bottom-bar {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: #111; border-top: 2px solid #333;
            padding: 15px 10px 25px 10px; z-index: 1000;
            display: flex; gap: 10px; justify-content: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
        }

        .btn-acao {
            flex: 1; height: 60px; border-radius: 12px; border: none;
            font-weight: bold; font-size: 14px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.1s;
        }
        .btn-acao:active { transform: scale(0.95); }
        .btn-acao span { font-size: 20px; margin-bottom: 2px; }

        .btn-marcar { background: #d4af37; color: #000; box-shadow: 0 4px 0 #997a15; }
        .btn-rota { background: #ff4444; color: #fff; box-shadow: 0 4px 0 #aa0000; }
        .btn-rota.gravando { background: #ffaa00; box-shadow: 0 4px 0 #cc7700; animation: pulseGravar 1s infinite alternate; }
        .btn-menu { background: #333; color: #fff; box-shadow: 0 4px 0 #111; max-width: 80px; }

        @keyframes pulseGravar { from { opacity: 1; } to { opacity: 0.6; } }

        /* MODAIS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            z-index: 2000; display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1a1a1a; width: 90%; max-width: 400px; max-height: 90vh;
            border: 2px solid #555; border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; gap: 12px; overflow-y: auto; color: white;
        }

        .modal-content h3 { margin: 0 0 10px 0; color: #d4af37; text-align: center; font-size: 18px; }
        
        label { font-size: 12px; color: #aaa; font-weight: bold; margin-bottom: -8px; }
        input, select, textarea {
            width: 100%; padding: 12px; background: #0a0a0a; color: #fff;
            border: 1px solid #444; border-radius: 6px; font-size: 14px; outline: none;
        }
        textarea { min-height: 80px; resize: none; }
        input:focus, textarea:focus, select:focus { border-color: #d4af37; }

        .coord-inputs { display: flex; gap: 10px; }
        .coord-inputs div { flex: 1; }

        .sentinela-inputs { display: flex; gap: 10px; background: #222; padding: 10px; border-radius: 6px; border: 1px dashed #555; }
        .sentinela-inputs div { flex: 1; }

        /* FOTO UPLOAD */
        .foto-preview {
            width: 100%; height: 150px; background: #050505; border: 2px dashed #444;
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            overflow: hidden; cursor: pointer; color: #666; font-size: 12px; position: relative;
        }
        .foto-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .foto-preview.has-image img { display: block; }
        .foto-preview.has-image span { display: none; }
        
        .modal-botoes { display: flex; gap: 10px; margin-top: 10px; }
        .btn-modal { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .btn-cancel { background: #333; color: white; }
        .btn-save { background: #00ff66; color: black; }

        /* RELATÓRIO */
        .relatorio-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .relatorio-card img { width: 100%; border-radius: 4px; margin-top: 8px; }
        .relatorio-meta { font-family: monospace; font-size: 10px; color: #aaa; }

    </style>
</head>
<body>

    <div class="scout-header">
        <div>
            <strong style="text-shadow: 1px 1px 0 #000;">AGÊNCIA DE BUSCA</strong><br>
            <span style="font-size:12px; color:#fff; text-shadow: 1px 1px 0 #000;">Reconhecimento Cinético</span>
        </div>
        <div id="gps-status" class="gps-status">GPS: Aguardando...</div>
    </div>

    <!-- O Mapa -->
    <div id="mapa-campo"></div>

    <!-- Barra Inferior -->
    <div class="scout-bottom-bar">
        <button class="btn-acao btn-marcar" onclick="abrirModalPinoManual()">
            <span>📍</span> MARCAR PONTO
        </button>
        <button id="btn-rota" class="btn-acao btn-rota" onclick="toggleRota()">
            <span id="icone-rota">🔴</span> <div id="texto-rota">GRAVAR ROTA</div>
        </button>
        <button class="btn-acao btn-menu" onclick="abrirMenu()">
            <span>📋</span> DADOS
        </button>
    </div>

    <!-- Modal Novo Pino -->
    <div id="modal-pino" class="modal-overlay">
        <div class="modal-content">
            <h3>📍 Registrar Ponto no Mapa</h3>

            <div class="coord-inputs">
                <div>
                    <label>Lat:</label>
                    <input type="number" step="any" id="pino-lat" placeholder="-23.7770">
                </div>
                <div>
                    <label>Lng:</label>
                    <input type="number" step="any" id="pino-lng" placeholder="-46.3005">
                </div>
            </div>
            
            <label>Evidência Fotográfica:</label>
            <input type="file" id="input-foto" accept="image/*" capture="environment" style="display:none;" onchange="processarFoto(event)">
            <div class="foto-preview" id="foto-preview" onclick="document.getElementById('input-foto').click()">
                <span>📸 Tocar para Câmera</span>
                <img id="img-result" src="">
            </div>

            <label>Categoria (Cor):</label>
            <select id="pino-tipo">
                <option value="#ff0000">🔴 Inimigo / Sentinela Parado</option>
                <option value="#00bbff">🔵 História / Missão</option>
                <option value="#a855f7">🟣 Anomalia / Eco</option>
                <option value="#d4af37">🟡 Loja / NPC</option>
                <option value="#00ff66">🟢 Poste / Safe Zone</option>
                <option value="#444444">⚫ Item / Loot / Outros</option>
            </select>

            <div class="sentinela-inputs">
                <div>
                    <label style="color:#ff4444;">Alcance (Visão):</label>
                    <select id="pino-visao">
                        <option value="Nenhum">Nenhum</option>
                        <option value="Curto">Curto (10m)</option>
                        <option value="Médio">Médio (25m)</option>
                        <option value="Longo">Longo (Rua toda)</option>
                    </select>
                </div>
                <div>
                    <label style="color:#ff4444;">Direção (Olha p/):</label>
                    <input type="text" id="pino-dir" placeholder="Norte, Mercado, etc.">
                </div>
            </div>

            <label>Título Rápido:</label>
            <input type="text" id="pino-titulo" placeholder="Ex: Sentinela Fox">

            <label>Notas de Campo:</label>
            <textarea id="pino-desc" placeholder="Descreva o local ou o posicionamento..."></textarea>

            <div class="modal-botoes">
                <button class="btn-modal btn-cancel" onclick="fecharModalPino()">Cancelar</button>
                <button class="btn-modal btn-save" onclick="salvarPino()">Salvar no Diário</button>
            </div>
        </div>
    </div>

    <!-- Modal Nova Rota Tipificada -->
    <div id="modal-rota" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: #ff4444;">🛤️ Registrar Trajeto</h3>
            
            <label>Categoria da Rota:</label>
            <select id="rota-tipo" style="border-color: #ff4444; font-weight: bold;">
                <option value="#ff0000">🔴 Rota de Patrulha (Inimigo)</option>
                <option value="#00ff66">🟢 Caminho Seguro / Alternativo</option>
                <option value="#ffaa00">🟠 Área de Dano / Risco</option>
                <option value="#444444">⚫ Caminho Neutro / Transição</option>
            </select>

            <label>Nome do Caminho:</label>
            <input type="text" id="rota-titulo" placeholder="Ex: Patrulha do Locobreak">

            <label>Análise Tática / Função:</label>
            <textarea id="rota-desc" placeholder="Rua asfaltada, inimigo faz a ronda rápida aqui. Força o jogador a entrar nas oficinas."></textarea>

            <div class="modal-botoes">
                <button class="btn-modal btn-cancel" onclick="descartarRota()">Descartar Rota</button>
                <button class="btn-modal btn-save" style="background:#ff4444; color:#fff;" onclick="salvarRotaConfirma()">Salvar Caminho</button>
            </div>
        </div>
    </div>

    <!-- Modal Menu de Dados -->
    <div id="modal-relatorio" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <h3>📋 Banco de Dados</h3>
            
            <div style="display:flex; flex-direction:column; gap:10px; margin-bottom: 15px;">
                <input type="file" id="file-import" accept=".json" style="display:none;" onchange="importarProjetoJSON(event)">
                <button class="btn-modal" style="background:#a855f7; color:#fff;" onclick="document.getElementById('file-import').click()">📥 Importar e Mesclar Projeto (JSON)</button>
                
                <div style="display:flex; gap:10px;">
                    <button class="btn-modal" style="background:#d4af37; color:#000;" onclick="exportarProjetoJSON()">📤 Salvar JSON</button>
                    <button class="btn-modal" style="background:#00bbff; color:#000;" onclick="exportarRelatorioHTML()">📑 Gerar PDF/HTML</button>
                </div>
                
                <button class="btn-modal btn-cancel" style="border:1px solid #ff4444; color:#ff4444;" onclick="limparTudo()">🗑️ Apagar Todo o Banco</button>
            </div>

            <div id="lista-rotas" style="margin-bottom: 15px;"></div>
            <div id="lista-pinos"></div>

            <button class="btn-modal btn-cancel" style="margin-top:auto;" onclick="document.getElementById('modal-relatorio').style.display='none'">Voltar ao Mapa</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ESTADO GLOBAL
        let map;
        let meuMarcador = null;
        let minhaLocalizacao = [-23.7770, -46.3005]; 
        let pinosData = [];
        let rotasData = [];
        let pinoLayer = L.layerGroup();
        let rotaLayer = L.layerGroup();
        
        // Estado de Gravação de Rota
        let isGravandoRota = false;
        let caminhoAtual = [];
        let linhaAtual = null;
        let tempoInicioRota = 0;
        let distanciaRotaAtual = 0;
        let lastPosForDistance = null;
        
        let tempRotaParams = null;
        let fotoBase64Atual = "";

        window.onload = () => {
            map = L.map('mapa-campo', { zoomControl: false }).setView(minhaLocalizacao, 17);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

            pinoLayer.addTo(map);
            rotaLayer.addTo(map);

            carregarMemoria();
            iniciarGPS();
            
            // Permite clicar no mapa para marcar pino rápido
            map.on('click', function(e) {
                abrirModalPinoMapa(e.latlng.lat, e.latlng.lng);
            });
        };

        function iniciarGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        minhaLocalizacao = [pos.coords.latitude, pos.coords.longitude];
                        const accuracy = pos.coords.accuracy;
                        
                        document.getElementById('gps-status').innerText = `GPS: ±${Math.round(accuracy)}m`;
                        document.getElementById('gps-status').style.color = accuracy < 20 ? '#00ff66' : '#ffaa00';

                        if (!meuMarcador) {
                            meuMarcador = L.circleMarker(minhaLocalizacao, { radius: 6, fillColor: '#00bbff', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map);
                            map.setView(minhaLocalizacao, 18);
                        } else {
                            meuMarcador.setLatLng(minhaLocalizacao);
                        }

                        if (isGravandoRota) {
                            caminhoAtual.push(minhaLocalizacao);
                            linhaAtual.setLatLngs(caminhoAtual);
                            if (lastPosForDistance) distanciaRotaAtual += map.distance(lastPosForDistance, minhaLocalizacao);
                            lastPosForDistance = minhaLocalizacao;
                            
                            // Calcula tempo ao vivo
                            const tempoDecorridoSegundos = Math.round((Date.now() - tempoInicioRota) / 1000);
                            const min = Math.floor(tempoDecorridoSegundos / 60);
                            const seg = tempoDecorridoSegundos % 60;
                            document.getElementById('texto-rota').innerText = `${Math.round(distanciaRotaAtual)}m | ${min}m${seg}s`;
                            
                            // NOVO: Salva estado atual para não perder em caso de bloqueio de tela/refresh acidental
                            salvarRotaAtivaOffline();
                        }
                    },
                    (err) => {
                        document.getElementById('gps-status').innerText = "GPS: Sem Sinal";
                        document.getElementById('gps-status').style.color = "#ff4444";
                    },
                    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
                );
            } else { alert("Seu navegador não suporta GPS."); }
        }

        // NOVO: Função de backup de emergência da rota em andamento
        function salvarRotaAtivaOffline() {
            if (isGravandoRota) {
                const estado = { caminhoAtual, distanciaRotaAtual, tempoInicioRota, lastPosForDistance };
                localStorage.setItem('scout_rota_ativa', JSON.stringify(estado));
            }
        }

        function abrirModalPinoManual() {
            abrirModalPinoMapa(minhaLocalizacao[0], minhaLocalizacao[1]);
        }

        function abrirModalPinoMapa(lat, lng) {
            document.getElementById('pino-lat').value = lat.toFixed(6);
            document.getElementById('pino-lng').value = lng.toFixed(6);
            document.getElementById('pino-titulo').value = '';
            document.getElementById('pino-desc').value = '';
            document.getElementById('pino-dir').value = '';
            fotoBase64Atual = "";
            document.getElementById('foto-preview').classList.remove('has-image');
            document.getElementById('img-result').src = "";
            document.getElementById('modal-pino').style.display = 'flex';
        }

        function fecharModalPino() { document.getElementById('modal-pino').style.display = 'none'; }

        function processarFoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; 
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    fotoBase64Atual = canvas.toDataURL('image/jpeg', 0.6); 
                    document.getElementById('img-result').src = fotoBase64Atual;
                    document.getElementById('foto-preview').classList.add('has-image');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function salvarPino() {
            const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const selTipo = document.getElementById('pino-tipo');
            
            const pino = {
                id: Date.now(),
                tag: `P${pinosData.length + 1}`,
                lat: parseFloat(document.getElementById('pino-lat').value),
                lng: parseFloat(document.getElementById('pino-lng').value),
                cor: selTipo.value,
                tipo: selTipo.options[selTipo.selectedIndex].text.substring(3),
                titulo: document.getElementById('pino-titulo').value || 'Sem Título',
                desc: document.getElementById('pino-desc').value,
                visao: document.getElementById('pino-visao').value,
                dir: document.getElementById('pino-dir').value || 'N/A',
                hora: horaAtual,
                foto: fotoBase64Atual 
            };

            pinosData.push(pino);
            salvarMemoria();
            desenharPinosMapa();
            fecharModalPino();
        }

        function desenharPinosMapa() {
            pinoLayer.clearLayers();
            pinosData.forEach(p => {
                const marker = L.circleMarker([p.lat, p.lng], { radius: 8, fillColor: p.cor, color: '#000', weight: 2, fillOpacity: 0.9 });
                marker.bindTooltip(p.tag, { permanent: true, direction: 'bottom', className: 'gps-status', offset: [0,5] });
                
                let popupStr = `<div style="font-family:sans-serif;"><b>${p.tag} - ${p.titulo}</b><br><span style="font-size:10px;">${p.hora} | [${p.tipo}]</span>`;
                if(p.cor === "#ff0000" && p.visao !== "Nenhum") {
                    popupStr += `<br><span style="font-size:11px; color:#ff4444;">👁️ Visão: ${p.visao} | Direção: ${p.dir}</span>`;
                }
                popupStr += `<p style="margin:5px 0;">${p.desc}</p></div>`;
                if(p.foto) popupStr += `<img src="${p.foto}" style="width:150px; border-radius:4px; margin-top:5px;">`;
                
                marker.bindPopup(popupStr);
                pinoLayer.addLayer(marker);
            });
        }

        // SISTEMA DE GRAVAÇÃO DE TRAJETOS
        function toggleRota() {
            if (!meuMarcador) { alert("Aguarde o GPS te localizar!"); return; }
            const btn = document.getElementById('btn-rota');
            const icone = document.getElementById('icone-rota');
            const texto = document.getElementById('texto-rota');

            if (!isGravandoRota) {
                isGravandoRota = true;
                caminhoAtual = [minhaLocalizacao];
                distanciaRotaAtual = 0;
                lastPosForDistance = minhaLocalizacao;
                tempoInicioRota = Date.now();
                linhaAtual = L.polyline(caminhoAtual, { color: '#ff4444', weight: 5, dashArray: '5, 5' }).addTo(rotaLayer);
                
                btn.classList.add('gravando');
                icone.innerText = '⏹️';
                texto.innerText = '0m | 0s';
                salvarRotaAtivaOffline(); // Salva estado inicial imediatamente
            } else {
                isGravandoRota = false;
                localStorage.removeItem('scout_rota_ativa'); // Remove o backup de emergência ao pausar intencionalmente

                const tempoTotalSegundos = Math.round((Date.now() - tempoInicioRota) / 1000);
                const min = Math.floor(tempoTotalSegundos / 60);
                const seg = tempoTotalSegundos % 60;
                const tempoFormatado = `${min}m ${seg}s`;
                
                tempRotaParams = { caminho: [...caminhoAtual], distancia: Math.round(distanciaRotaAtual), tempo: tempoFormatado, tempoSegundos: tempoTotalSegundos };
                
                btn.classList.remove('gravando');
                icone.innerText = '🔴';
                texto.innerText = 'GRAVAR ROTA';
                
                document.getElementById('rota-titulo').value = '';
                document.getElementById('rota-desc').value = '';
                document.getElementById('modal-rota').style.display = 'flex';
            }
        }

        function salvarRotaConfirma() {
            if(!tempRotaParams) return;
            const selTipo = document.getElementById('rota-tipo');
            
            const rotaSalva = {
                id: Date.now(),
                tag: `R${rotasData.length + 1}`,
                caminho: tempRotaParams.caminho,
                distancia: tempRotaParams.distancia,
                tempo: tempRotaParams.tempo,
                tempoSegundos: tempRotaParams.tempoSegundos,
                cor: selTipo.value,
                tipo: selTipo.options[selTipo.selectedIndex].text.substring(3),
                titulo: document.getElementById('rota-titulo').value || 'Trajeto sem Título',
                desc: document.getElementById('rota-desc').value || 'Sem descrição'
            };
            
            rotasData.push(rotaSalva);
            salvarMemoria();
            desenharRotasMapa();
            document.getElementById('modal-rota').style.display = 'none';
            tempRotaParams = null;
        }

        function descartarRota() {
            document.getElementById('modal-rota').style.display = 'none';
            tempRotaParams = null;
            desenharRotasMapa(); 
        }

        function desenharRotasMapa() {
            rotaLayer.clearLayers();
            rotasData.forEach(r => {
                const polyline = L.polyline(r.caminho, { color: r.cor, weight: 5, opacity: 0.8 }).addTo(rotaLayer);
                polyline.bindPopup(`<div style="font-family:sans-serif;"><b style="color:${r.cor}">${r.tag} - ${r.titulo}</b><br><span style="font-size:11px; color:#666;">Distância: ${r.distancia}m | Tempo: ${r.tempo}</span><p style="margin:5px 0;">${r.desc}</p></div>`);
            });
        }

        // MEMÓRIA E MERGE OFFLINE
        function salvarMemoria() {
            localStorage.setItem('scout_pinos', JSON.stringify(pinosData));
            localStorage.setItem('scout_rotas', JSON.stringify(rotasData));
        }

        function carregarMemoria() {
            const p = localStorage.getItem('scout_pinos');
            const r = localStorage.getItem('scout_rotas');
            const ativa = localStorage.getItem('scout_rota_ativa'); // Resgata rota em andamento

            if (p) pinosData = JSON.parse(p);
            if (r) rotasData = JSON.parse(r);
            desenharPinosMapa();
            desenharRotasMapa();

            // Restaura estado de gravação caso a tela tenha bloqueado
            if (ativa) {
                try {
                    const estado = JSON.parse(ativa);
                    isGravandoRota = true;
                    caminhoAtual = estado.caminhoAtual || [];
                    distanciaRotaAtual = estado.distanciaRotaAtual || 0;
                    tempoInicioRota = estado.tempoInicioRota || Date.now();
                    lastPosForDistance = estado.lastPosForDistance || null;

                    // Redesenha a linha no mapa
                    linhaAtual = L.polyline(caminhoAtual, { color: '#ff4444', weight: 5, dashArray: '5, 5' }).addTo(rotaLayer);
                    
                    // Ajusta UI
                    document.getElementById('btn-rota').classList.add('gravando');
                    document.getElementById('icone-rota').innerText = '⏹️';
                } catch(e) {
                    localStorage.removeItem('scout_rota_ativa');
                }
            }
        }

        function limparTudo() {
            if (confirm("Apagar todo o Banco de Dados do navegador?")) {
                pinosData = []; rotasData = []; 
                salvarMemoria();
                localStorage.removeItem('scout_rota_ativa');
                pinoLayer.clearLayers(); rotaLayer.clearLayers();
                if(linhaAtual) rotaLayer.removeLayer(linhaAtual);
                isGravandoRota = false;
                document.getElementById('btn-rota').classList.remove('gravando');
                document.getElementById('icone-rota').innerText = '🔴';
                document.getElementById('texto-rota').innerText = 'GRAVAR ROTA';
                document.getElementById('modal-relatorio').style.display='none';
            }
        }

        function exportarProjetoJSON() {
            const projetoCompleto = { pinos: pinosData, rotas: rotasData };
            if (pinosData.length === 0 && rotasData.length === 0) { alert("O mapa está vazio."); return; }
            
            const dataStr = JSON.stringify(projetoCompleto, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "paranapiacaba_master.json";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importarProjetoJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dadosImportados = JSON.parse(e.target.result);
                    if (dadosImportados.pinos || dadosImportados.rotas) {
                        if (dadosImportados.pinos) pinosData = pinosData.concat(dadosImportados.pinos);
                        if (dadosImportados.rotas) rotasData = rotasData.concat(dadosImportados.rotas);
                    } else if (Array.isArray(dadosImportados)) { // Legado
                        pinosData = pinosData.concat(dadosImportados);
                    }
                    salvarMemoria();
                    desenharPinosMapa();
                    desenharRotasMapa();
                    alert("✅ Arquivo mesclado com sucesso! Os pontos foram somados ao mapa.");
                } catch (err) { alert("❌ Erro ao ler o arquivo JSON."); }
            };
            reader.readAsText(file);
            event.target.value = ""; 
        }

        function abrirMenu() {
            const divPinos = document.getElementById('lista-pinos');
            const divRotas = document.getElementById('lista-rotas');
            
            divPinos.innerHTML = "<h4 style='color:#d4af37; border-bottom:1px solid #444; padding-bottom:5px;'>📍 PONTOS MARCADOS</h4>";
            pinosData.forEach(p => {
                divPinos.innerHTML += `
                    <div class="relatorio-card">
                        <strong style="color:${p.cor}">${p.tag} - ${p.titulo}</strong>
                        <div class="relatorio-meta">Tipo: ${p.tipo} | Horário: ${p.hora}</div>
                        ${p.visao && p.visao !== 'Nenhum' ? `<div style="font-size:11px; color:#ff4444; margin-top:3px;">👁️ Visão: ${p.visao} | Dir: ${p.dir}</div>` : ''}
                        <p style="font-size:12px; margin:5px 0;">"${p.desc}"</p>
                        ${p.foto ? `<img src="${p.foto}">` : ''}
                    </div>
                `;
            });

            divRotas.innerHTML = "<h4 style='color:#ff4444; border-bottom:1px solid #444; padding-bottom:5px;'>🛤️ TRAJETOS E BLOQUEIOS</h4>";
            if (rotasData.length === 0) divRotas.innerHTML += "<span style='font-size:12px; color:#aaa;'>Nenhuma rota gravada.</span>";
            rotasData.forEach(r => {
                divRotas.innerHTML += `
                    <div class="relatorio-card" style="border-color:${r.cor}; border-width: 2px;">
                        <strong style="color:${r.cor}">${r.tag} - ${r.titulo}</strong>
                        <div class="relatorio-meta">Tipo: ${r.tipo} <br> Distância: ${r.distancia} metros | Tempo a pé: ${r.tempo}</div>
                        <p style="font-size:12px; margin:5px 0;">"${r.desc}"</p>
                    </div>
                `;
            });

            document.getElementById('modal-relatorio').style.display = 'flex';
        }
